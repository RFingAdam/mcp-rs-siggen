[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-siggen-mcp"
version = "0.2.0"
description = "MCP server for Rohde & Schwarz signal generator automation via TCP/IP SCPI"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Adam Engelbrecht", email = "adam@rfingadam.com" }
]
keywords = [
    "mcp",
    "signal-generator",
    "rohde-schwarz",
    "scpi",
    "test-automation",
    "rf-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # PEP 508 direct reference (not a bare name): "scpi-core" also exists on
    # PyPI as an unrelated package by a different author in the same problem
    # domain, so a bare name silently resolves to the wrong library for any
    # installer that doesn't read [tool.uv.sources] (e.g. plain pip).
    "scpi-core @ git+https://github.com/RFingAdam/scpi-core.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pyyaml>=6.0",
]
sim = [
    "pyyaml>=6.0",
]

[tool.uv.sources]
# The git URL lives in `dependencies` so pip honours it too; uv pins the
# exact commit in uv.lock. For local development across both repos, uncomment
# the path form below and do not commit it uncommented (CI has no sibling
# scpi-core checkout, so a committed path override breaks the build there).
# scpi-core = { path = "../scpi-core", editable = true }

[tool.hatch.metadata]
# scpi-core is depended on by git URL, which hatchling treats as a direct
# reference. Required because the name is taken on PyPI by an unrelated
# package -- see the note in [project.dependencies].
allow-direct-references = true

[project.scripts]
rs-siggen-mcp = "rs_siggen_mcp.__main__:main"
siggen-simulator = "rs_siggen_mcp.sim.__main__:main"

[project.urls]
Homepage = "https://github.com/RFingAdam/mcp-rs-siggen"
Repository = "https://github.com/RFingAdam/mcp-rs-siggen"
Issues = "https://github.com/RFingAdam/mcp-rs-siggen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rs_siggen_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["rs_siggen_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 70
